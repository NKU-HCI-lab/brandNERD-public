<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Reset Password</h1>
        <form id="reset-form">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" name="confirm" required minlength="6">
            </div>
            <div id="message" class="message" hidden></div>
            <button type="submit">Reset Password</button>
        </form>
        <p class="link"><a href="/signin">Back to sign in</a></p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('message').textContent = 'Missing reset token. Please use the link from your email.';
            document.getElementById('message').className = 'message error';
            document.getElementById('message').hidden = false;
            document.querySelector('button[type="submit"]').disabled = true;
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('message');
            msg.hidden = true;

            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;

            if (password !== confirm) {
                msg.textContent = 'Passwords do not match.';
                msg.className = 'message error';
                msg.hidden = false;
                return;
            }

            try {
                const res = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: password }),
                });
                const data = await res.json();

                if (res.ok) {
                    msg.innerHTML = data.message + ' <a href="/signin">Sign in</a>';
                    msg.className = 'message success';
                    msg.hidden = false;
                    document.getElementById('reset-form').reset();
                    document.querySelector('button[type="submit"]').disabled = true;
                } else {
                    msg.textContent = data.error || 'Reset failed.';
                    msg.className = 'message error';
                    msg.hidden = false;
                }
            } catch (err) {
                msg.textContent = 'Connection error. Please try again.';
                msg.className = 'message error';
                msg.hidden = false;
            }
        });
    </script>
</body>
</html>
