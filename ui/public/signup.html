<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Sign Up</h1>
        <form id="signup-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" name="confirm" required minlength="6">
            </div>
            <div id="message" class="message" hidden></div>
            <button type="submit">Sign Up</button>
        </form>
        <p class="link">Already have an account? <a href="/signin">Sign in</a></p>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('message');
            msg.hidden = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;

            if (password !== confirm) {
                msg.textContent = 'Passwords do not match.';
                msg.className = 'message error';
                msg.hidden = false;
                return;
            }

            try {
                const res = await fetch('/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });
                const data = await res.json();

                if (res.ok) {
                    msg.textContent = data.message || 'Account created successfully!';
                    msg.className = 'message success';
                    msg.hidden = false;
                    document.getElementById('signup-form').reset();
                } else {
                    msg.textContent = data.error || 'Sign up failed.';
                    msg.className = 'message error';
                    msg.hidden = false;
                }
            } catch (err) {
                msg.textContent = 'Connection error. Please try again.';
                msg.className = 'message error';
                msg.hidden = false;
            }
        });
    </script>
</body>
</html>
